spring.application.name=room-rental-management

# Tự động nạp cấu hình máy cục bộ (nếu có file application-local.properties - được .gitignore bảo vệ)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (Đọc biến môi trường hoặc cấu hình mặc định an toàn)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/room_rental_management?useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# Root Admin & Security Configs
app.security.root-phone=${ROOT_PHONE:0779637353}
app.security.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXdpdGgtMjU2LWJpdHMta2V5LXNpemU=}
app.security.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Jackson timezone config
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Timezone configurations for database connection to prevent timezone shift
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'
spring.datasource.hikari.data-source-properties.serverTimezone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Cloudinary Configs (Được nạp từ environment variables hoặc application-local.properties)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
